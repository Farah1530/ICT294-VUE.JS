<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Apprendre Vue.js</title>
</head>

<body>
    <div id="app">
        <p v-if="isAvailable">
            Produit disponible !
        </p>

        <p v-else>
            Produit indisponible.
        </p>

        <p v-if="stock > 10">
            Stock suffisant
        </p>

        <p v-else-if="stock > 0">
            Stock limité
        </p>

        <p v-else>
            Rupture de stock
        </p>
    </div>

    <!-- Chargement de Vue.js 3 depuis le CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const {
            createApp
        } = Vue

        createApp({
            data() {
                return {
                    isAvailable: true,
                    stock: 5
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
